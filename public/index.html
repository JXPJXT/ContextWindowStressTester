<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Window Stress Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>Context Window <span>Stress Tester</span></h1>
            <p>Evaluate LLM performance under various context injection scenarios.</p>
        </header>

        <main>
            <section id="setup-section" class="input-section glass-panel">
                <h2>Configure Test</h2>
                <form id="test-form">
                    <div class="form-group">
                        <label for="base-prompt">Base Prompt / Knowledge</label>
                        <textarea id="base-prompt" rows="3" placeholder="Enter the core factual knowledge..." required>The capital of France is Paris. It is known for the Eiffel Tower.</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="question">Question</label>
                        <input type="text" id="question" placeholder="Ask a question about the base knowledge..." value="What is the capital of France?" required>
                    </div>

                    <div class="form-group">
                        <label for="extra-context">User Extra Noisy Context (Optional)</label>
                        <textarea id="extra-context" rows="2" placeholder="Add any extra noise you want to inject..."></textarea>
                    </div>

                    <button type="submit" id="run-btn" class="btn-primary">
                        <span class="btn-text">Run Stress Test</span>
                        <div class="spinner hidden" id="loading-spinner"></div>
                    </button>
                </form>
            </section>

            <section class="results-section hidden" id="results-section">
                <h2>Test Results Dashboard</h2>
                <div class="results-grid" id="results-grid">
                    <!-- Results cards injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Template for Result Card -->
    <template id="result-card-template">
        <div class="result-card glass-panel">
            <div class="card-header">
                <h3 class="case-title"></h3>
                <span class="badge hallucination-badge"></span>
            </div>
            <div class="card-body">
                <div class="model-info">
                    <span class="model-label">Model:</span> <span class="model-val"></span>
                </div>
                <div class="metric-row">
                    <div class="metric">
                        <span class="metric-label">Response Time</span>
                        <span class="metric-value time-val"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Tokens (P/C)</span>
                        <span class="metric-value token-val"></span>
                    </div>
                </div>
                <div class="metric-row">
                    <div class="metric">
                        <span class="metric-label">Tokens / Sec</span>
                        <span class="metric-value tps-val"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Noise Ratio</span>
                        <span class="metric-value noise-val"></span>
                    </div>
                </div>
                <div class="answer-box">
                    <h4>Answer:</h4>
                    <p class="answer-text"></p>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
